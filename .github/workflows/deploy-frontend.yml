name: Deploy Frontend to EC2 WEB

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/tienda-perritos-frontend:latest ./frontend

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tienda-perritos-frontend:latest

      - name: Deploy to EC2 WEB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_WEB_HOST }}
          username: ${{ secrets.EC2_WEB_USER }}
          key: ${{ secrets.EC2_WEB_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/tienda-perritos-frontend:latest
            sudo docker stop tienda-frontend || true
            sudo docker rm tienda-frontend || true
            sudo docker run -d --name tienda-frontend -p 80:80 --restart always ${{ secrets.DOCKER_USERNAME }}/tienda-perritos-frontend:latest
            sudo docker ps